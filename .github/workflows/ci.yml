name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python environment
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Verify CLI entry point
      run: |
        python src/avgforge.py --version

    - name: Run smoke tests
      run: |
        python src/avgforge.py --help
        python src/avgforge.py init --help
        python src/avgforge.py char --help

    - name: Create test project
      run: |
        python src/avgforge.py init test-project --template blank
        python src/avgforge.py info test-project

    - name: Validate test project
      run: |
        python src/avgforge.py check test-project

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linters
      run: pip install flake8 black isort
    - name: Run flake8
      run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
    - name: Check black formatting
      run: black --check src/
    - name: Check import order
      run: isort --check-only src/

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build single-file distribution
      run: |
        python -c "import shutil; shutil.copy('src/avgforge.py', 'avgforge')"
        chmod +x avgforge
        tar czf avgforge-1.0.0-linux-x64.tar.gz avgforge
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: avgforge-dist
        path: avgforge-1.0.0-linux-x64.tar.gz
