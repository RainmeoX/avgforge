name: CI 持续集成

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 验证 Python 环境
      run: |
        python --version
        pip --version

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: 验证 CLI 入口
      run: |
        python src/avgforge/__main__.py --version

    - name: 运行冒烟测试
      run: |
        python src/avgforge/__main__.py --help
        python src/avgforge/__main__.py init --help
        python src/avgforge/__main__.py char --help

    - name: 创建测试项目
      run: |
        python src/avgforge/__main__.py init test-project --template blank
        python src/avgforge/__main__.py info test-project

    - name: 验证测试项目
      run: |
        python src/avgforge/__main__.py check test-project

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 安装代码检查工具
      run: pip install flake8 black isort
    - name: 运行 flake8
      run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
    - name: 检查 black 格式
      run: black --check src/
    - name: 检查导入顺序
      run: isort --check-only src/

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 构建单文件分发
      run: |
        python -c "import shutil; shutil.copy('src/avgforge.py', 'avgforge')"
        chmod +x avgforge
        tar czf avgforge-1.0.0-linux-x64.tar.gz avgforge
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: avgforge-dist
        path: avgforge-1.0.0-linux-x64.tar.gz
